# ---
# author: Just Deploy It
# project: Hister on Railway
# purpose: Update the direct-image Railway template only after all pre-push gates pass
# used_by: GitHub Actions scheduler and manual workflow dispatch
# status: active
# verified: 2026-08-27
# ---
name: Update Hister

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hister
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record the current live template pin
        id: current
        run: echo "digest=$(jq -r .digest upstream.json)" >> "$GITHUB_OUTPUT"

      - name: Advance every immutable Hister pin
        run: python3 scripts/update_hister.py

      - name: Detect an update
        id: changes
        run: |
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run every updater test and configuration gate
        if: steps.changes.outputs.changed == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/verify.py
          git diff --check

      - name: Clean-build the exact tested candidate pin
        if: steps.changes.outputs.changed == 'true'
        run: |
          image="$(jq -r '"\(.image)@\(.digest)"' upstream.json)"
          grep -Fqx "ARG HISTER_IMAGE=${image}" Dockerfile
          docker build --pull --no-cache --build-arg "HISTER_IMAGE=${image}" --tag hister-railway:update-test .

      - name: Read back the unchanged direct-image Railway template
        if: steps.changes.outputs.changed == 'false'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: python3 scripts/update_hister.py --sync-template --expected-current-digest "${{ steps.current.outputs.digest }}"

      - name: Apply and read back the direct-image Railway template
        if: steps.changes.outputs.changed == 'true'
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: python3 scripts/update_hister.py --sync-template --expected-current-digest "${{ steps.current.outputs.digest }}"

      - name: Commit and push only the fully verified candidate
        if: steps.changes.outputs.changed == 'true'
        run: |
          version="$(jq -r .version upstream.json)"
          git config user.name 'just-deploy-it-bot'
          git config user.email 'just-deploy-it-bot@users.noreply.github.com'
          git add Dockerfile upstream.json railway-template.json
          git diff --cached --check
          git commit -m "chore: update Hister to ${version}"
          git push origin HEAD:main
